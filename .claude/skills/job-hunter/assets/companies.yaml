  # === AI Evals Job Application Strategy — Tier A/B/C (added 2026-05-30 from strategy doc) ===
  # Focus: AI Evals / Quality / Validation roles — direct map from the hardware QA decade.
  # Tier A (Frontier Labs):            Anthropic*, OpenAI, Google DeepMind, xAI, Meta AI/FAIR
  # Tier B (Evals & Observability):    Braintrust, LangChain*, Galileo, Patronus AI, Arize AI
  # Tier C (AI-First Product):         Cursor (Anysphere), Perplexity, Harvey*, Sierra
  #   (* enriched in their existing entries above — not duplicated here)

  # --- Tier A — Frontier AI Labs ---
  - name: OpenAI
    bucket: frontier-ai-labs
    tier: A
    location: SF
    careers_url: https://openai.com/careers/
    target_role: "AI Engineer / Residency"
    why_fit: "OpenAI Residency is built for career changers — use it as the front door, not a regular AI Engineer posting."
    watch_outs: "Less validation-discipline-focused than Anthropic. Lean harder on the LLM evals layer in your pitch."
    priority: high

  - name: Google DeepMind
    bucket: frontier-ai-labs
    tier: A
    location: ""
    careers_url: ""  # TODO
    target_role: "Research Engineer / AI Quality"
    why_fit: "Large eval orgs across Gemini and other products. Hardware-industry background reads well at Google."
    watch_outs: "Hiring slower than Anthropic/OpenAI. Bureaucratic process; expect 8-12 weeks end-to-end."
    priority: high

  - name: xAI
    bucket: frontier-ai-labs
    tier: A
    location: ""
    careers_url: https://x.ai/careers
    target_role: "AI Engineer"
    why_fit: "Smaller team, fewer applicants per role. Less prestige-filtered than Anthropic/OpenAI."
    watch_outs: "Culture is engineering-velocity-first. Validation rigor is valued but not the brand. Frame fit carefully."
    priority: high

  - name: Meta AI / FAIR
    bucket: frontier-ai-labs
    tier: A
    location: ""
    careers_url: https://www.metacareers.com/
    target_role: "Research Engineer (Evals)"
    why_fit: "Llama deployment scale needs massive eval infrastructure. Strong validation hires for safety/integrity work."
    watch_outs: "Large-company process. Less startup energy. Comp is strong but pace is slower."
    priority: medium

