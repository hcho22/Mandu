answers:
  - field: "Why are you interested in this role? Please reference one specific area from the job description (e.g. building integrations against external APIs, owning the integration pipeline, or creating evals for agentic tool performance) and explain why it appeals to you."
    limit_words: 150
    text: |
      Creating evals for agentic tool performance. It's the one I'd pick to do every day.
      On Purvia, my open-source RAG app, I built a tool-calling agent loop on the OpenAI API with 4 tools and a 5-iteration cap, then the evals around it. A 60-question retrieval set runs on every pull request and posts the score change as a comment. An escalation eval's deterministic checks block merges.
      I learned the most when the eval itself was wrong. It breached its 5% false-resolve ceiling four runs in a row, and the cause was the LLM judge, not the product. I compared five judge designs on replayed drafts and cut wrong verdicts from 38 of 280 to 0 of 300.
      I'd tune North's tool descriptions the same way, one change at a time, each measured. Ten years of validation at Zebra taught me to check the test before trusting the result.
    claims: [purvia-tool-calling-agent-loop, purvia-retrieval-golden-set, purvia-e7-escalation-eval, purvia-e7-offline-judge-root-cause, zebra-validation-ownership]

