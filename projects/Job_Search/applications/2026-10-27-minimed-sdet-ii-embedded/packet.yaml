gaps:
  - gap: "You applied to MiniMed's Senior SDET, Embedded Software/Firmware (R-801917, Northridge) on 2026-10-20; this SDET II role describes the same embedded pump-firmware test work one level down, so the same recruiter may see both."
    how_to_own_it: "Say it plainly if asked: you want the embedded test work and are open to either level. A shorter path is to ask the recruiter for R-801917 whether they want you considered for both before you submit this one."
  - gap: "Hardware-in-the-loop and software-in-the-loop test benches are a must-have, and the profile has no Claim for benches, simulators, or automated fixtures."
    how_to_own_it: "Zebra validation was hands-on lab work on shipped devices, but do not call it HIL or SIL unless you used or built benches there; if you did, add an attested Claim before you submit. Otherwise say it is new, and point to the offline test suite with network access blocked as the nearest software-side isolation work."
  - gap: "Bluetooth Low Energy testing (pairing, reconnection, recovery, interoperability) is a listed duty and a nice-to-have, and no BLE, serial, or other device-interface testing is in the profile."
    how_to_own_it: "If Zebra's product validation covered Bluetooth, USB, or serial interfaces, that is worth an attested Claim; until then, say it is new and that you would start with the pairing and recovery scenarios the posting lists."
  - gap: "\"Hands-on experience with embedded systems and testing embedded firmware\": the Zebra Claims say hardware products and failure isolation across hardware, firmware, and software, not firmware test design by name."
    how_to_own_it: "Describe what you actually did at Zebra on device firmware (validation runs, failure isolation, proving fixes) in your own words, and do not stretch it to writing firmware or reading C or C++ firmware code."
  - gap: "CI/CD tools named are GitLab and Jenkins; all CI in the profile is GitHub Actions."
    how_to_own_it: "Say the pipelines are GitHub Actions and the concepts carry over: jobs on every pull request, blocking gates, and diagnosing failures from logs."
  - gap: "JavaScript test automation is project-scale and small next to Python; the posting asks \"JavaScript and/or Python\"."
    how_to_own_it: "Lead with Python (the Purvia suite). If asked about JavaScript, say your JavaScript work is project-scale and that Python is your main test language."
  - gap: "Level and pay: the posting asks 0-2 years, and 10 years of validation can read as overqualified for an SDET II; the California band is $97K-$165K."
    how_to_own_it: "Say you want hands-on embedded test automation, that your paid software automation is 2.0 years of C# (2016-08 to 2018-07), and that you are applying at this level on purpose. Ask where in the band the role is calibrated before the final round."
  - gap: "No paid work since 2018: a career break with ML retraining, volunteer Omdena work, then solo unpaid products since 2025, built by directing AI coding agents."
    how_to_own_it: "Name the sequence briefly. Say agents wrote most of the project code under your direction and review, then move to what the test suites and CI gates show about current practice."
  - gap: "Medical-device or other safety-critical experience is a nice-to-have, and there is none in the profile."
    how_to_own_it: "Say it is new. The closest practice is Zebra's written procedures, acceptance criteria, and final reports, and the Immerse CI checks that keep requirements and test evidence in agreement."
  - gap: "Purvia is public: its escalation eval breached its gate in four scheduled runs, and the fix (PR #184, merged 2026-10-16) has not been measured by a scheduled run yet; the first one is 2026-11-01."
    how_to_own_it: "Tell it as the root-cause story in the resume bullet: the judge, not the product, was wrong, and the fix is merged with one-off runs showing 0 of 300 wrong verdicts. Say the scheduled confirmation is on 2026-11-01."
  - gap: "The Omdena Claims have open questions in the profile: the months each project ran, whether you were the formal task lead on the histopathology project, its framework and where it was deployed, and whether the chatbot reached real users."
    how_to_own_it: "Answer them before an interview so the dates and the word led hold up. All Omdena work was unpaid volunteer work; say so if asked."
  - gap: "The form could not be read: Workday shows the application steps and a screening questionnaire only after sign-in."
    how_to_own_it: "Upload the resume, check for text questions and a cover letter upload, and answer screening questions literally (for example, medical-device experience is no). Paste any text questions to Mandu for drafting."
  - gap: "Hybrid in Northridge, 3-4 days a week in office (about 13 miles from Burbank); Workday's own field says On-Site."
    how_to_own_it: "Confirm the in-office schedule in the first call."
