cover_letter:          # the form has an optional Cover Letter field (file or pasted text)
  limit_words: 350
  greeting: "Dear Syllo hiring team,"
  paragraphs:
    - text: "Your posting asks for someone who measures how an AI system behaves, runs experiments to compare approaches, and finds root causes. I did that work for ten years as a validation engineer at Zebra Technologies, and I do it now on Purvia, my open-source retrieval and support-bot project."
      claims: [zebra-validation-ownership, zebra-failure-analysis, purvia-retrieval-golden-set]
    - text: "The best example is an eval that went wrong. My escalation eval checks that a support bot hands questions it can't answer to a person, with a 5% ceiling on wrong auto-answers. It breached that ceiling four runs in a row, reaching 27%. Before touching the product, I ran the pipeline end to end with only its live gates and got 0 false resolves in 55 runs. The fault was the offline LLM judge. Once it could see the retrieved context, it graded whether a draft was true, not whether it answered the question, so an accurate \"I don't have that information\" passed. I compared five judge designs on replayed drafts and kept the one that makes the judge name the asked and stated values first. Wrong verdicts went from 38 of 280 to 0 of 300."
      claims: [purvia-e7-escalation-eval, purvia-e7-offline-judge-root-cause]
    - text: "I treat model choices as experiments with a price. For the live answer gate, a stronger judge model let 15 of 66 should-escalate drafts through on 85 stored drafts, while a stricter rubric on the current model let 1 through, for about $0.00007 more per reply, so I kept the rubric. On retrieval, a 60-question benchmark scores vector, keyword, and hybrid search on pull requests, and when a RAGAS gate flagged a question that retrieved nothing, I traced it to keyword stemming and raised hybrid recall@5 from 0.950 to 0.967."
      claims: [purvia-answer-gate-model-comparison, purvia-retrieval-golden-set, purvia-keyword-stem-tier]
    - text: "Production data at your scale would be new to me, since Purvia runs on a synthetic corpus, and so would litigation. I'd start by learning how your lawyers judge a good answer, then build the measurements around that. I'd welcome a conversation about how you evaluate your agentic features today."
      claims: [purvia-retrieval-golden-set]
  closing: "Sincerely,"

gaps:
  - gap: "Degree and years: \"Master's degree ... with substantial hands-on experience; or 2-4 years of relevant professional experience.\" You have a B.S. in EE, and your 10.5 professional years are hardware validation at Zebra, ending in 2018."
    how_to_own_it: "Say it plainly: no Master's and no paid data-science role. The professional years are measurement, test design, and root-cause work on shipped products; the AI evaluation work since 2025 is solo project work, all public on GitHub. Let the interviewer decide whether that counts as relevant."
  - gap: "\"Strong foundation in applied statistics, experimentation, and quantitative analysis.\" Statistics is coursework only (the Google Advanced Data Analytics certificate, completion date still pending in the profile). No repo shows hypothesis tests, confidence intervals, or power analysis."
    how_to_own_it: "This is the line a data-science interviewer will test hardest. Review binomial confidence intervals, A/B test design and sample size, and multiple comparisons before any call. Then turn Purvia's weakness into the answer: the escalation eval has 11 should-escalate questions, so one miss moves the rate by about 9 points, and a 5% ceiling on 11 rows allows zero misses. Say what you would change (more rows, intervals on every rate, repeated sampling at temperature above zero)."
  - gap: "\"Strong Python and SQL skills and experience working directly with production data.\" No production data anywhere: Purvia runs on a 16-chunk synthetic demo corpus with 60 questions, and Rep Today's telemetry has only synthetic rows."
    how_to_own_it: "Claim Python and SQL at project scale (Purvia's retrieval functions and row-level security are 48 SQL migrations), and say production data is the gap. Do not let the 10,000-chunk benchmark sound like production; its own caveat says 1.000 recall is trivial at that size."
  - gap: "\"Comfortable navigating production code and data systems you did not build.\" Partial: at Zebra you isolated failures in firmware and software other teams wrote, but you have no record of working inside someone else's data stack."
    how_to_own_it: "Use the Zebra failure analysis as the example of working in systems you did not build. Do not use agent-written code as an example; you directed its design."
  - gap: "AI coding agents did the 2026-10-16 judge and gate investigations under your direction, four days before this packet."
    how_to_own_it: "Be able to explain the E7 judge fix and the answer-gate comparison without notes before submitting: read Purvia PR #184, PR #186, docs/adr/0015-answer-gate-value-extraction.md, and docs/evals.md section 6. Know why a bare yes/no judge failed once it saw the context, what the five designs were, and why gpt-5-mini was rejected. If asked who wrote the code, say you direct AI coding agents and own the design, review, and verification."
  - gap: "No scheduled run has confirmed the fixes yet. Issues #163, #172, and #177 were closed by the PRs that fixed them, and the evals moved from weekly to monthly on 2026-10-16, so the first scheduled run on the fixes is 2026-11-01."
    how_to_own_it: "Say the before and after numbers come from one-off CI runs on branches. If asked why monthly, the honest reason is cost on a project with no users, and the tradeoff is that a regression can go unnoticed for up to a month. Check the 2026-11-01 results before any interview after that date."
  - gap: "Dashboards and internal tooling: the posting asks for tools and dashboards. Purvia has pull-request comments, dated markdown reports, auto-filed issues, and LangSmith traces, but no dashboard."
    how_to_own_it: "Describe the reporting that exists and say a dashboard would be new work."
  - gap: "Bonus line: \"modern cloud data platforms and production data infrastructure.\" Only Postgres on Supabase."
    how_to_own_it: "Say so; name Postgres, pgvector, and Supabase and nothing else."
  - gap: "Litigation and legal AI are new to you."
    how_to_own_it: "The cover letter already says so. The closest match is Purvia's permission-aware retrieval, since law-firm documents also have strict access rules."
  - gap: "Work authorization and sponsorship questions are Yes/No on the form."
    how_to_own_it: "Answer them yourself on the form."
