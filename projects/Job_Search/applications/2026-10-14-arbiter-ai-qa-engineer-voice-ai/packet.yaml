cover_letter:          # asked for by hcho; the form has no cover letter field
  limit_words: 350
  greeting: "Dear Arbiter hiring team,"
  paragraphs:
    - text: "Most of my career has been the work your QA Engineer posting describes. I dig into a failure until I find the actual root cause, then write it up so an engineer can act on it right away. I spent ten years as a validation engineer at Zebra Technologies. I wrote the test plans, acceptance criteria, and final reports for 6 shipped hardware products, and I isolated failures across hardware, firmware, software, and test infrastructure."
      claims: [zebra-validation-ownership, zebra-failure-analysis]
    - text: "Now I do the same work on LLM agents. In Purvia, my open-source support-bot project, every draft answer has to pass a retrieval gate and two LLM judges, and anything that misses a gate goes to a human queue. I built the eval that checks that handoff: 18 test questions, a weekly 5% ceiling on questions that should have escalated but didn't, and a check that the offline and runtime judges agree."
      claims: [purvia-deflection-and-human-handoff, purvia-e7-escalation-eval]
    - text: "That eval has been over its ceiling for four weeks. When I traced the misses, every one was a draft the runtime judge had already marked not answered, including \"I don't have that information.\" So the breach comes from how the offline judge scores those drafts, not from the runtime gate that routes the conversation. I haven't landed the fix yet. Separating agent behavior from the setup around it is the triage your role describes. Earlier, a benchmark reported 0.000 for 42 runs because its test users lacked a workspace membership. Guard tests now stop an eval from publishing a score when it measured nothing. A wrong number on a dashboard does more damage than a missing one."
      claims: [purvia-e7-escalation-eval, purvia-fail-closed-eval-guards]
    - text: "I'd bring the same habits to your campaigns: test scripts that cover escalation paths and handoffs before launch, regression suites and release checks on every change, and bug reports with severity and evidence attached. Voice AI and healthcare would be new to me, and I'd learn them by working the live issues. I'd like to hear how you run campaign QA today."
      claims: [purvia-retrieval-golden-set, immerse-traceability-release-guards, zebra-validation-ownership]
  closing: "Sincerely,"

gaps:
  - gap: "The form has no cover letter field."
    how_to_own_it: "Upload only the resume on the form, and do not merge the letter into the resume file. Then send the letter to Arbiter's Head of Product, who the role reports to: a LinkedIn connection note is too short for it, so connect with a one-line note and send the letter as a message once they accept, or email it if you find an address."
  - gap: "The bar is 3 to 5 years in QA, support engineering, or technical operations 'on a production software platform'."
    how_to_own_it: "Ten years of validation at Zebra covers QA, but most of it was hardware, with SDK validation and 2.0 years of C# automation as the software part, and it ended in 2018. Say that plainly, then point to the agent QA work since 2025 as current software practice."
  - gap: "No voice AI, IVR, conversational-AI platform, or contact-center experience."
    how_to_own_it: "Say it is new. The closest work is the Purvia support bot's escalation path and human handoff, which maps to their nurse and live-staff handoffs. CreativeBridge's on-device speech-to-text exists, but it is lightly tested; mention it only if asked about speech."
  - gap: "No healthcare, HIPAA, or PHI experience."
    how_to_own_it: "Say HIPAA is new. The nearest evidence is the CreativeBridge child-privacy controls (consent, PII scrubbing, retention jobs) and Rep Today's anonymous telemetry, both project-scale and never used by real users."
  - gap: "No production users behind any of the AI work."
    how_to_own_it: "Every project is solo and unpaid, and Purvia's demo is offline. Talk about how the checks were designed and what they caught, not about scale."
  - gap: "Purvia's escalation gate and RAGAS gate are failing right now, in a public repo (issues #163, #172, #177)."
    how_to_own_it: "The cover letter already names it, so be ready to walk through it: four weeks over the 5% ceiling, every false-resolved row one the runtime judge marked not answered, and no fix landed. Reread issue #163 and projects/Purvia/log/2026-10-12.md before any call."
  - gap: "Observability and call-analytics tools are thin: LangSmith traces only."
    how_to_own_it: "Name LangSmith and the plain key=value logs honestly; say you would learn their call-analytics stack on the job."
  - gap: "Part of the job is reviewing live conversations by hand."
    how_to_own_it: "Treat it as the source of the regression cases and scoring rubrics the role also asks for, and ask how much of the week it takes."
