    how_to_own_it: "Do not claim provider partnerships. If you have a concrete Zebra example of working to another team's ship date, add it to the profile first; otherwise call it the part you would ramp on."
  - gap: "Purvia's escalation and RAGAS gates are failing right now, in a public repo (issues #163, #172, and #177)."
    how_to_own_it: "Bring it up before they find it. The bigger question set caught a problem the smaller one missed, and you can say what you would change. As of 2026-10-11 it is four weeks, and the RAGAS run that day crashed on a dependency import and measured nothing. The snapshots show the offline judge counting a refusal as an answer while the runtime gate escalates, so be ready to say the two judges disagree and that is what the check caught. Reread issue #163 and projects/Purvia/log/2026-10-12.md before any call."
