answers:
  - field: "Why are you interested in OpenRouter? Please be specific."
    limit_words: 150
    text: |
      Each time I swapped models in my own projects, the lesson was the same. The API call is easy. Knowing the new model didn't quietly break something is the hard part.

      In Purvia, my open-source RAG project, model choice is configurable per role across OpenAI, Azure OpenAI, and OpenAI-compatible endpoints. When I moved the answer generator to a newer model, I held the judges fixed so the eval scores stayed comparable. A weekly escalation eval uses judges from two providers and checks that they agree. It has failed four weeks running since I expanded its question set, and that's the eval doing its job.

      Before this I spent ten years running product validation at Zebra Technologies, writing the test plans, acceptance criteria, and final reports for hardware launches. Your role asks for that discipline on every model you ship, and that's the work I want to do.
    claims: [reptoday-premium-coach-llm, purvia-model-surface-and-adrs, purvia-e7-escalation-eval, zebra-validation-ownership]

