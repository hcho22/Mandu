# hcho's Master profile: the single source of truth for job applications.
#
# Rules (enforced by render_profile.py; see CONTEXT.md for the terms):
# - Every Claim has Linked evidence (a URL anyone could open) or Attested evidence (hcho vouches for it).
# - Work from June 2025 onward, and all independent work, must be Linked.
# - Evidence scale: employer (paid employment), project (own or volunteer work), coursework.
#   Volunteer work is project-scale. Project time never counts as employer tenure.
# - Every number carries an as_of date and its source. Re-read the source before using a number older than 14 days.
# - Only Attested Claims may leave dates pending, and they add no time to the Skill index until dated.
# - Tailored resumes and cover notes may only select and rephrase these Claims.
# - Independent work is described once as built by directing AI coding agents; Claims use plain verbs.
#   Mark a Claim `interview_ready: study` if hcho could not yet explain it, how and why, without notes;
#   drafts skip it until it is marked `yes`.
#
# After editing, run: python3 render_profile.py

