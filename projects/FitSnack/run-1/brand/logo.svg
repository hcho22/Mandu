<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="Nonzero logo">
  <!-- Nonzero logomark: the slashed zero. The ring is the day; the rising slash refuses the zero. -->
  <g id="logomark">
    <circle cx="80" cy="80" r="46" fill="none" stroke="#12261F" stroke-width="14"/>
    <line x1="49" y1="116" x2="111" y2="44" stroke="#C97B2D" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g id="wordmark" fill="#12261F" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" letter-spacing="-1">
    <text x="160" y="102" font-size="72">nonzero</text>
  </g>
</svg>
