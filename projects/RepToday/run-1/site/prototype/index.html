<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nonzero - Ready Screen prototype</title>
<style>
  :root {
    --ink: #12261F; --bone: #F4F1EA; --ember: #C97B2D;
    --moss: #7FA48E; --pine: #1E4D3B; --clay: #B9B2A4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bone); color: var(--ink);
    display: flex; flex-direction: column; max-width: 430px; margin: 0 auto;
    font-variant-numeric: tabular-nums;
  }
  .screen { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .screen.active { display: flex; }

  /* ---------- Ready Screen ---------- */
  header { padding: 18px 20px 6px; display: flex; align-items: center; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
  .mark svg { width: 24px; height: 24px; }
  .daylabel { font-size: 13px; color: var(--clay); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .variety { padding: 2px 20px 0; font-size: 15px; color: var(--pine); }

  .scorebar { display: flex; align-items: center; gap: 14px; padding: 14px 20px 4px; }
  .ring { width: 62px; height: 62px; flex: none; }
  .scoretext { font-size: 14px; line-height: 1.45; color: var(--pine); }
  .scoretext b { font-size: 17px; color: var(--ink); }
  .note {
    margin: 10px 20px 0; padding: 10px 12px; background: rgba(127,164,142,0.16);
    border-left: 3px solid var(--moss); border-radius: 6px; font-size: 13.5px; color: var(--pine);
  }

  .session { flex: 1; overflow-y: auto; padding: 14px 20px 8px; }
  .today { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .today h1 { font-size: 28px; letter-spacing: -0.5px; }
  .gen { font-size: 12px; color: var(--clay); }
  .block { margin-bottom: 12px; }
  .pillar {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--bone); background: var(--pine);
    padding: 3px 8px; border-radius: 999px; margin-bottom: 6px;
  }
  .pillar.mobility { background: var(--moss); color: var(--ink); }
  .pillar.primal { background: var(--ember); }
  .ex {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid rgba(18,38,31,0.08); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 6px;
  }
  .ex .n { font-size: 15.5px; font-weight: 600; }
  .ex .t { font-size: 13px; color: var(--pine); margin-top: 1px; }
  .swap {
    border: none; background: none; color: var(--clay); font-size: 13px; font-weight: 600;
    padding: 6px 8px; cursor: pointer; border-radius: 8px;
  }
  .swap:active { background: rgba(18,38,31,0.06); color: var(--pine); }

  .chips { display: flex; gap: 6px; padding: 8px 20px; overflow-x: auto; }
  .chip {
    flex: none; border: 1.5px solid rgba(18,38,31,0.18); background: none; color: var(--ink);
    font-size: 15px; font-weight: 600; padding: 8px 13px; border-radius: 999px; cursor: pointer;
  }
  .chip.on { background: var(--ink); color: var(--bone); border-color: var(--ink); }

  .startwrap { padding: 10px 20px calc(18px + env(safe-area-inset-bottom)); }
  .start {
    width: 100%; border: none; background: var(--ember); color: #fff;
    font-size: 19px; font-weight: 700; padding: 17px; border-radius: 16px; cursor: pointer;
    letter-spacing: -0.2px;
  }
  .start:active { filter: brightness(0.93); }

  .demo {
    display: flex; gap: 8px; justify-content: center; padding: 8px 20px 14px;
    border-top: 1px dashed rgba(18,38,31,0.15); margin-top: 2px;
  }
  .demo span { font-size: 12px; color: var(--clay); align-self: center; }
  .demo button {
    border: 1px solid rgba(18,38,31,0.2); background: none; color: var(--pine);
    font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }

  /* ---------- Player ---------- */
  .player { background: var(--ink); color: var(--bone); }
  body:has(.player.active) { background: var(--ink); }
  .player header { color: var(--bone); }
  .player .quit { border: none; background: none; color: var(--clay); font-size: 14px; cursor: pointer; }
  .elapsed { font-size: 14px; color: var(--clay); }
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 24px; text-align: center; }
  .stage .pill { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--moss); }
  .stage h2 { font-size: 30px; letter-spacing: -0.5px; }
  .stage .target { font-size: 52px; font-weight: 700; color: var(--ember); letter-spacing: -1px; }
  .stage .sets { font-size: 15px; color: var(--clay); }
  .rest { font-size: 15px; color: var(--moss); min-height: 22px; }
  .done {
    width: calc(100% - 48px); margin: 0 24px calc(20px + env(safe-area-inset-bottom));
    border: none; background: var(--bone); color: var(--ink); font-size: 18px; font-weight: 700;
    padding: 16px; border-radius: 16px; cursor: pointer;
  }
  .progressdots { display: flex; gap: 5px; justify-content: center; padding: 10px 0 16px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(244,241,234,0.25); }
  .dot.now { background: var(--ember); }
  .dot.did { background: var(--moss); }

  /* ---------- Post ---------- */
  .post { align-items: center; justify-content: center; text-align: center; padding: 32px; gap: 14px; }
  .post h2 { font-size: 30px; letter-spacing: -0.5px; }
  .post p { font-size: 16px; color: var(--pine); line-height: 1.5; max-width: 300px; }
  .post .ring { width: 96px; height: 96px; }
  .post .back {
    border: none; background: var(--ink); color: var(--bone); font-size: 17px; font-weight: 700;
    padding: 14px 28px; border-radius: 14px; cursor: pointer; margin-top: 8px;
  }

  /* narrow embeds (site hero iframe) */
  @media (max-width: 360px) {
    .today h1 { font-size: 22px; }
    .gen { display: none; }
    .chip { font-size: 13.5px; padding: 7px 10px; }
    .start { font-size: 17px; padding: 15px; }
    .demo { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<!-- ================= READY SCREEN ================= -->
<div class="screen active" id="ready">
  <header>
    <div class="mark">
      <svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="46" fill="none" stroke="#12261F" stroke-width="14"/><line x1="49" y1="116" x2="111" y2="44" stroke="#C97B2D" stroke-width="14" stroke-linecap="round"/></svg>
      nonzero
    </div>
    <div class="daylabel" id="daylabel">Day 1</div>
  </header>
  <div class="variety" id="variety"></div>
  <div class="scorebar">
    <svg class="ring" id="scorering" viewBox="0 0 100 100"></svg>
    <div class="scoretext" id="scoretext"></div>
  </div>
  <div class="note" id="note" hidden></div>
  <div class="session" id="session"></div>
  <div class="chips" id="chips"></div>
  <div class="startwrap">
    <button class="start" id="start">Start &middot; <span id="startmin"></span> min</button>
  </div>
  <div class="demo">
    <span>demo controls</span>
    <button id="nextday">complete + next day</button>
    <button id="missday">miss a day</button>
    <button id="reset">reset</button>
  </div>
</div>

<!-- ================= PLAYER ================= -->
<div class="screen player" id="playerscreen">
  <header>
    <button class="quit" id="quit">End</button>
    <div class="elapsed" id="elapsed">0:00</div>
  </header>
  <div class="stage">
    <div class="pill" id="p_pillar"></div>
    <h2 id="p_name"></h2>
    <div class="target" id="p_target"></div>
    <div class="sets" id="p_sets"></div>
    <div class="rest" id="p_rest"></div>
  </div>
  <div class="progressdots" id="dots"></div>
  <button class="done" id="setdone">Set done</button>
</div>

<!-- ================= POST ================= -->
<div class="screen post" id="postscreen">
  <svg class="ring" id="postring" viewBox="0 0 100 100"></svg>
  <h2>That counted.</h2>
  <p id="posttext"></p>
  <button class="back" id="back">Done</button>
</div>

<script src="exercises.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var CHIP_VALUES = [5, 10, 15, 20, 30, 45, 60];
  var state = {
    day: 1,
    defaultMinutes: 15,
    minutes: 15,
    history: [],          // {pillar, exerciseIds, completed:boolean}
    misses: 0,
    session: null,
  };

  // --- Consistency Score (same shape as extras/simulator: weekly adherence,
  //     recency-weighted; a miss dents, never zeroes) -----------------------
  function score() {
    var shows = state.history.filter(function (h) { return h.completed; }).length;
    var total = state.history.length;
    if (total === 0) return 100;
    var recent = state.history.slice(-14);
    var num = 0, den = 0;
    recent.forEach(function (h, i) {
      var w = i + 1;
      num += (h.completed ? 1 : 0.55) * w;   // a miss keeps 55% credit: dents, never zeroes
      den += w;
    });
    return Math.max(25, Math.round((num / den) * 100));
  }
  function dents() {
    return state.history.slice(-14).map(function (h, i) { return { i: i, miss: !h.completed }; }).filter(function (x) { return x.miss; });
  }

  function ringSVG(el, value, size) {
    var r = 40, c = 2 * Math.PI * r;
    var filled = c * value / 100;
    var dentMarks = dents().map(function (d) {
      var angle = (d.i / 14) * 360 - 90;
      var rad = angle * Math.PI / 180;
      var x1 = 50 + (r - 7) * Math.cos(rad), y1 = 50 + (r - 7) * Math.sin(rad);
      var x2 = 50 + (r + 7) * Math.cos(rad), y2 = 50 + (r + 7) * Math.sin(rad);
      return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#C97B2D" stroke-width="4" stroke-linecap="round" opacity="0.8"/>';
    }).join('');
    el.innerHTML =
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="rgba(18,38,31,0.12)" stroke-width="9"/>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#7FA48E" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + filled + ' ' + c + '" transform="rotate(-90 50 50)"/>' + dentMarks +
      '<text x="50" y="57" text-anchor="middle" font-size="24" font-weight="700" fill="#12261F">' + value + '</text>';
  }

  // --- Ready Screen render -------------------------------------------------
  function regenerate() {
    var t0 = performance.now();
    state.session = generateSession('demo-day' + state.day, state.minutes, state.history);
    var ms = performance.now() - t0;
    render(ms);
  }

  function render(genMs) {
    var s = state.session;
    document.getElementById('daylabel').textContent = 'Day ' + state.day;
    document.getElementById('variety').textContent = s.varietyLine;
    document.getElementById('startmin').textContent = s.minutes;

    var sc = score();
    ringSVG(document.getElementById('scorering'), sc);
    document.getElementById('scoretext').innerHTML =
      '<b>Consistency ' + sc + '</b><br>' +
      (state.misses > 0
        ? 'Dented ' + state.misses + (state.misses === 1 ? ' time' : ' times') + '. Never zeroed. You’re someone who moves.'
        : 'You’re someone who moves.');

    var note = document.getElementById('note');
    if (state.day >= 3 && state.defaultMinutes !== state.minutes) {
      note.hidden = false;
      note.textContent = 'Adjusted: your default is now ' + state.minutes + ' minutes, matching what you actually complete.';
    } else if (state.day >= 4) {
      note.hidden = false;
      note.textContent = 'This week leans ' + (s.focus === 'strength' ? 'strength' : 'mobility') + ': your ' + (s.focus === 'strength' ? 'mobility' : 'strength') + ' days were landing well, so variety is up.';
    } else { note.hidden = true; }

    var sess = document.getElementById('session');
    sess.innerHTML = '<div class="today"><h1>Today: ' + s.minutes + ' min</h1><div class="gen">assembled in ' + (genMs < 1 ? '<1' : Math.round(genMs)) + ' ms, offline</div></div>' +
      s.blocks.map(function (b) {
        return '<div class="block"><span class="pillar ' + b.pillar + '">' + b.pillar + '</span>' +
          b.exercises.map(function (e) {
            return '<div class="ex" data-id="' + e.id + '"><div><div class="n">' + e.name + '</div>' +
              '<div class="t">' + e.sets + ' × ' + e.target + '</div></div>' +
              '<button class="swap" data-id="' + e.id + '">swap</button></div>';
          }).join('') + '</div>';
      }).join('');

    var chips = document.getElementById('chips');
    chips.innerHTML = CHIP_VALUES.map(function (v) {
      return '<button class="chip' + (v === s.minutes ? ' on' : '') + '" data-min="' + v + '">' + v + '</button>';
    }).join('');
  }

  document.getElementById('chips').addEventListener('click', function (ev) {
    var b = ev.target.closest('.chip'); if (!b) return;
    state.minutes = +b.dataset.min;
    regenerate();
  });
  document.getElementById('session').addEventListener('click', function (ev) {
    var b = ev.target.closest('.swap'); if (!b) return;
    var res = swapExercise(state.session, b.dataset.id);
    if (res === null) { b.textContent = 'no alternative'; b.disabled = true; return; }
    render(0);
  });

  // demo controls
  document.getElementById('nextday').addEventListener('click', function () {
    state.history.push({ pillar: state.session.focus, exerciseIds: state.session.exerciseIds, completed: true });
    state.day += 1; regenerate();
  });
  document.getElementById('missday').addEventListener('click', function () {
    state.history.push({ pillar: 'rest', exerciseIds: [], completed: false });
    state.misses += 1; state.day += 1; regenerate();
  });
  document.getElementById('reset').addEventListener('click', function () {
    state.day = 1; state.history = []; state.misses = 0; state.minutes = state.defaultMinutes; regenerate();
  });

  // --- Player ---------------------------------------------------------------
  var player = { list: [], idx: 0, set: 1, t0: 0, timer: null, resting: false, finished: true };

  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  document.getElementById('start').addEventListener('click', function () {
    player.list = state.session.blocks.reduce(function (a, b) { return a.concat(b.exercises); }, []);
    player.idx = 0; player.set = 1; player.t0 = Date.now(); player.resting = false; player.finished = false;
    show('playerscreen'); renderPlayer();
    clearInterval(player.timer);
    player.timer = setInterval(function () {
      var sec = Math.floor((Date.now() - player.t0) / 1000);
      document.getElementById('elapsed').textContent = Math.floor(sec / 60) + ':' + ('0' + sec % 60).slice(-2);
    }, 500);
  });

  function renderPlayer() {
    var e = player.list[player.idx];
    document.getElementById('p_pillar').textContent = e.pillar + ' · ' + e.pattern;
    document.getElementById('p_name').textContent = e.name;
    document.getElementById('p_target').textContent = e.target;
    document.getElementById('p_sets').textContent = 'Set ' + player.set + ' of ' + e.sets;
    document.getElementById('p_rest').textContent = player.resting ? 'Rest 25s, then go' : '';
    document.getElementById('dots').innerHTML = player.list.map(function (_, i) {
      return '<div class="dot' + (i < player.idx ? ' did' : i === player.idx ? ' now' : '') + '"></div>';
    }).join('');
  }

  document.getElementById('setdone').addEventListener('click', function () {
    var e = player.list[player.idx];
    if (player.set < e.sets) { player.set += 1; player.resting = true; }
    else if (player.idx < player.list.length - 1) { player.idx += 1; player.set = 1; player.resting = true; }
    else { return finishSession(); }
    renderPlayer();
    setTimeout(function () { player.resting = false; renderPlayer(); }, 1200);
  });
  document.getElementById('quit').addEventListener('click', finishSession);

  function finishSession() {
    if (player.finished) return;
    player.finished = true;
    clearInterval(player.timer);
    var mins = Math.max(1, Math.round((Date.now() - player.t0) / 60000));
    state.history.push({ pillar: state.session.focus, exerciseIds: state.session.exerciseIds, completed: true });
    state.day += 1;
    var sc = score();
    ringSVG(document.getElementById('postring'), sc);
    document.getElementById('posttext').textContent =
      'A full show-up, logged. Consistency ' + sc + '. Tomorrow’s session will be ready when you open the app.';
    show('postscreen');
  }
  document.getElementById('back').addEventListener('click', function () { regenerate(); show('ready'); });

  regenerate();
})();
</script>
</body>
</html>
